services:
  - type: web
    name: machadka-qardho-sms
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.ts
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: DATA_DIR
        value: /var/data
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: machadka-data
      mountPath: /var/data
      sizeGB: 1
